	<g transform="translate(930 250)">
		<rect width="190" height="190" rx="40" fill="#0a2a52" stroke="#2e6bff" stroke-width="3" />
		<text x="95" y="112" fill="#ffffff" font-family="monospace" font-size="64" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
		<text x="95" y="156" fill="#9ec5ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Typing Game</text>
