<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#030a16" />
			<stop offset="55%" stop-color="#071426" />
			<stop offset="100%" stop-color="#0a2a52" />
		</linearGradient>
		<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#2e6bff" stop-opacity="0.55" />
			<stop offset="100%" stop-color="#2e6bff" stop-opacity="0" />
		</linearGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#bg)" />
	<circle cx="1080" cy="90" r="320" fill="url(#glow)" />
	<circle cx="90" cy="580" r="260" fill="url(#glow)" />

	<g font-family="Arial, Helvetica, sans-serif">
		<text x="80" y="150" fill="#9ec5ff" font-size="26" font-weight="700" letter-spacing="6">
			JOGO DE DIGITAÇÃO EM PORTUGUÊS
		</text>
		<text x="80" y="270" fill="#ffffff" font-size="78" font-weight="800">
			Digite mais rápido.
		</text>
		<text x="80" y="360" fill="#ffffff" font-size="78" font-weight="800">
			Erre menos.
		</text>
		<text x="80" y="440" fill="#a8b6cb" font-size="30">
			Iniciante, amador e expert • modo personalizado • ranking online
		</text>
	</g>

	<g transform="translate(80 500)">
		<g transform="translate(0 0)">
			<rect width="74" height="74" rx="14" fill="#0b1322" stroke="#263a5c" stroke-width="2" />
			<text x="37" y="47" fill="#ffffff" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">Ç</text>
		</g>
		<g transform="translate(90 0)">
			<rect width="74" height="74" rx="14" fill="#0b1322" stroke="#263a5c" stroke-width="2" />
			<text x="37" y="47" fill="#ffffff" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">~</text>
		</g>
		<g transform="translate(180 0)">
			<rect width="74" height="74" rx="14" fill="#0b1322" stroke="#263a5c" stroke-width="2" />
			<text x="37" y="47" fill="#ffffff" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">á</text>
		</g>
		<g transform="translate(290 0)">
			<rect width="240" height="74" rx="14" fill="#0b1322" stroke="#263a5c" stroke-width="2" />
			<text x="120" y="47" fill="#ffffff" font-family="monospace" font-size="24" font-weight="700" text-anchor="middle">Espaço</text>
		</g>
